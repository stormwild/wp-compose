 user                                                           nginx;
 worker_processes                                               auto;
 pid                                                            /var/run/nginx.pid;

events {
    worker_connections                                          1024;
}

http {
    include                                                     /etc/nginx/mime.types;
    default_type                                                application/octet-stream;

    #                                                           Add custom MIME types
    types {
        font/ttf                                                ttf;
        font/woff                                               woff;
        font/woff2                                              woff2;
    }

    log_format                                                  main '$remote_addr - $remote_user [$time_local] "$request" '
    '$status                                                    $body_bytes_sent "$http_referer" '
    '"$http_user_agent"                                         "$http_x_forwarded_for"';

    access_log                                                  /var/log/nginx/access.log main;
    error_log                                                   /var/log/nginx/error.log warn;

    sendfile                                                    on;
    keepalive_timeout                                           65;

    upstream php {
        server                                                  wordpress:9000;
    }

    server {
        listen                                                  80;
        listen                                                  [::]:80;
        server_name                                             localhost;

        root                                                    /var/www/html;
        index                                                   index.php;

        client_max_body_size                                    100M;

        location / {
            try_files                                           $uri $uri/ /index.php?$args;
        }

        location ~ \.php$ {
            fastcgi_split_path_info                             ^(.+\.php)(/.+)$;
            fastcgi_pass                                        php;
            fastcgi_index                                       index.php;
            include                                             fastcgi_params;
            fastcgi_param                                       SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param                                       PATH_INFO $fastcgi_path_info;
            fastcgi_buffers                                     16 16k;
            fastcgi_buffer_size                                 32k;
            fastcgi_read_timeout                                600;
        }

        #                                                       Security headers
        add_header                                              X-Content-Type-Options "nosniff" always;
        add_header                                              X-Frame-Options "SAMEORIGIN" always;
        add_header                                              X-XSS-Protection "1; mode=block" always;
        #                                                       add_header Content-Security-Policy "default-src 'self' data: https: https://secure.gravatar.com *.gravatar.com; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://secure.gravatar.com *.gravatar.com; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self';" always;

        #                                                       Static files handling
        location ~* \.(css)$ {
            expires                                             max;
            add_header                                          Cache-Control "public, no-transform";
            log_not_found                                       off;
            charset                                             utf-8;
            add_header                                          Content-Type "text/css; charset=utf-8";
        }

        location ~* \.(js)$ {
            expires                                             max;
            add_header                                          Cache-Control "public, no-transform";
            log_not_found                                       off;
        }

        location ~* \.(jpg|jpeg|png|gif|ico|webp)$ {
            expires                                             max;
            add_header                                          Cache-Control "public, no-transform";
            log_not_found                                       off;
        }

        location ~* \.(ttf|woff|woff2)$ {
            expires                                             max;
            add_header                                          Cache-Control "public, no-transform";
            log_not_found                                       off;
        }
    }
}
